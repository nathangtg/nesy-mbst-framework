[project]
name = "nesy-mbst"
version = "0.1.0"
description = "Neuro-Symbolic Model-Based Statistical Testing: automated Markov chain usage model synthesis from natural language requirements"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

authors = [
  { name = "Nathan G.", email = "nathan.n@imail.sunway.edu.my" },
  { name = "Jordan Chay",          email = "23009376@imail.sunway.edu.my" },
  { name = "Jaeden Ting YiYong",   email = "23009798@imail.sunway.edu.my" },
  { name = "Wai Phyo Hein",        email = "22108765@imail.sunway.edu.my" },
]

keywords = [
  "model-based testing",
  "statistical testing",
  "neuro-symbolic AI",
  "active automata learning",
  "Markov chain",
  "LLM",
  "software testing",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
  "Intended Audience :: Science/Research",
]

dependencies = [
  "python-dotenv>=1.0.0",
  "langchain>=1.3.9",
  "langchain-openai>=1.3.2",
  "numpy>=2.4.6",
  "scipy>=1.17.1",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.urls]
Repository = "https://github.com/nathangtg/llm-mbst-research"
Paper      = "https://github.com/nathangtg/llm-mbst-research/blob/master/latex/main.pdf"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
